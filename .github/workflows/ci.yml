name: CI

on:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install flake8
        run: pip install flake8

      - name: Lint app
        run: flake8 app.py

      - name: Install pytest and Flask
        run: pip install pytest flask

      - name: Run tests
        run: pytest

      - name: Build Docker image
        run: docker build -t myapp:ci .
